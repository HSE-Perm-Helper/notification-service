name: Tests and build

on:
  pull_request:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build
        run: chmod +x gradlew ; CI=true ./gradlew clean build
      - name: Test
        run: ./gradlew check

#      - name: Publish Test Results
#        uses: EnricoMi/publish-unit-test-result-action@v2
#        if: always()
#        with:
#          files: |
#            build/test-results/test/*.xml

      - name: Publish Sonarlint Results
        uses: jwgmeligmeyling/spotbugs-github-action@v1.2
        with:
          name: Sonarlint
          title: Sonarlint report
          path: build/reports/sonarlint/*.xml
        
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-gradle-output
          path: |
            build/libs/notification-service-standalone.jar
          retention-days: 1
        
  push_to_registry:
    name: Deploy New Version
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        
        with:
          images: melowetty/notification-service
          
      - name: Download Jar
        uses: actions/download-artifact@v4
        with:
          name: build-gradle-output
          
      - name: Log in to Docker Hub
        uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  
      - name: Build and Push Image
        uses: docker/build-push-action@eafaea8d0f5853934deece2ffa67af59d936562b
        with:
          context: .
          push: true
          tags: melowetty/notification-service:latest
          labels: ${{ steps.meta.outputs.labels }}
